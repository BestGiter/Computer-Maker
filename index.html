<!DOCTYPE html>
<html>
    <head>
    <style>
        html, body {
            margin: 0;
            overflow: hidden;
        }
        #game {
            position: absolute;
            display: block;
            touch-action: none;
        }
        #post {
            position: absolute;
            display: block;
            touch-action: none;
            pointer-events: none;
        }
        button, input {
            background-color: black;
            color: white;
            border-radius: 0px;
            box-sizing: border-box;
        }
        #code {
            position: absolute;
            bottom: 0px;
            height: 40px;
            width: 100px;
        }
        #name {
            position: absolute;
            bottom: 0px;
            left: 100px;
            height: 40px;
            width: 100px;
        }
        #open {
            position: absolute;
            right: 0px;
        }
        .toolbar-item {
            position: absolute;
            bottom: 0px;
            height: 40px;
            width: 100px;
        }
        #createGate {
            right: 0px;
        }
        #wireGates {
            right: 100px;
        }
        #deleteGate {
            right: 200px;
        }
        #moveGate {
            right: 300px;
        }
        .option {
            height: 40px;
            width: 100px;
            right: 0px;
        }
    </style>
    </head>
    <body>
        <canvas id="game" tabindex="0"></canvas>
        <input id="code" placeholder="Code...">
        <input id="name" placeholder="Name...">
        <div id="create"></div>
        <button id="createGate" class="toolbar-item" onclick="create_gate()">Create gate</button>
        <button id="wireGates" class="toolbar-item" onclick="wire_gates()">Wire gates</button>
        <button id="deleteGate" class="toolbar-item" onclick="delete_gate()">Delete gate</button>
        <button id="moveGate" class="toolbar-item" onclick="move_gate()">Move gate</button>
        <canvas id="post" tabindex="0"></canvas>
        <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
        <script src="main.js"></script>
    </body>
</html>
