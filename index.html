<!DOCTYPE html>
<html>
    <head>
    <style>
        html, body {
            margin: 0;
            overflow: hidden;
        }
        #game {
            position: absolute;
            display: block;
        }
        #code {
            position: absolute;
            bottom: 0px;
            width: 100px;
        }
        #name {
            position: absolute;
            bottom: 0px;
            left: 100px;
            width: 100px;
        }
        #open {
            position: absolute;
            right: 0px;
        }
    </style>
    </head>
    <body>
        <canvas id="game" tabindex="0"></canvas>
        <input id="code">
        <input id="name">
        <input id="filePicker" type="file" hidden>
        <button id="open">Open</button>
        <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
        <script src="main.js"></script>
    </body>
</html>
